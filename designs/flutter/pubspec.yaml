name: chat_ui_kit
description: Minimal & clean chat app UI kit — theme, widgets, and screens.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Bundle Inter + JetBrains Mono for pixel-parity with the web kit.
  # Download the .ttf files and drop them here, or replace the fontFamily
  # references in lib/theme/app_typography.dart with the `google_fonts`
  # package if you'd rather fetch them at runtime.
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #   - family: JetBrainsMono
  #     fonts:
  #       - asset: assets/fonts/JetBrainsMono-Medium.ttf
  #         weight: 500
