name: pulse_chat
description: "Real-time PulseChat Mobile Application with File and Photo Sharing"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  socket_io_client: ^3.0.2
  http: ^1.2.1
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  intl: ^0.19.0
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
